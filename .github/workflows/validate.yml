name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts
      - name: Check publication metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('custom_components/cisco_popup/manifest.json').read_text())
          assert 'YOUR_GITHUB_USERNAME' not in str(data), 'Run scripts/configure_repository.py first'
          assert data['codeowners'], 'Set a GitHub owner'
          PY
